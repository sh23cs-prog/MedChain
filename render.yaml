services:
  # ─── 1. Spring Boot Core Backend ──────────────────────────────────────────────
  - type: web
    name: medchain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: medchain-db
          property: connectionString
      - key: ML_SERVICE_URL
        value: http://medchain-sentinel-ml:8000
      - key: JWT_SECRET
        generateValue: true
      - key: AES_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: BLOCKCHAIN_ENABLED
        value: "false"

  # ─── 2. Sentinel AI FastAPI Microservice ──────────────────────────────────────
  - type: web
    name: medchain-sentinel-ml
    runtime: docker
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  # ─── 3. React Frontend Client ────────────────────────────────────────────────
  - type: web
    name: medchain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: medchain-backend
          envVarKey: RENDER_EXTERNAL_URL

# ─── 4. Persistent Managed PostgreSQL Database ─────────────────────────────────
databases:
  - name: medchain-db
    plan: free
    databaseName: medchaindb
    user: medchain
