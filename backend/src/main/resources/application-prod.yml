spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://postgres:5432/medchaindb}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:medchain}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:medchain_prod_password}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false

  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:${MAIL_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${SMTP_USERNAME:${MAIL_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:${MAIL_PASSWORD:}}}
    from: ${SPRING_MAIL_FROM:${SMTP_FROM:${MAIL_FROM:onboarding@resend.dev}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

resend:
  api:
    key: ${RESEND_API_KEY:}
  from: ${SPRING_MAIL_FROM:${RESEND_FROM:MedChain <onboarding@resend.dev>}}

mail:
  from: ${SPRING_MAIL_FROM:${SMTP_FROM:${MAIL_FROM:onboarding@resend.dev}}}

ml:
  service:
    url: ${ML_SERVICE_URL:https://medchain-sentinel-ml.onrender.com}

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:https://med-chain-amber.vercel.app,https://*.vercel.app,http://localhost:3000}

logging:
  level:
    com.medchain: INFO
    org.springframework.security: WARN
