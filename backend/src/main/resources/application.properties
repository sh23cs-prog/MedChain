spring.application.name=medchain-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}

# ─── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:medchain_super_secret_key_2025_blockchain_secure_minimum_256_bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── ML Service ─────────────────────────────────────────────────────────────────
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ─── CORS ────────────────────────────────────────────────────────────────────────
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Local EVM Permissioned Test Network (Hardhat Node) ──────────────────────────
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL:http://localhost:8545}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
# WARNING: Test account #0 for local EVM node verification
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

# ─── IPFS ────────────────────────────────────────────────────────────────────────
ipfs.api.url=${IPFS_API_URL:http://localhost:5001}
ipfs.gateway.url=${IPFS_GATEWAY_URL:http://localhost:8080}
ipfs.enabled=${IPFS_ENABLED:true}

# ─── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ─── Swagger ─────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── File Upload ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Mail Configuration ──────────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.from=${SPRING_MAIL_FROM:${SMTP_FROM:${MAIL_FROM:onboarding@resend.dev}}}
mail.provider=${MAIL_PROVIDER:${EMAIL_PROVIDER:AUTO}}
mail.from=${SPRING_MAIL_FROM:${SMTP_FROM:${MAIL_FROM:onboarding@resend.dev}}}
resend.api.key=${RESEND_API_KEY:}
resend.from=${SPRING_MAIL_FROM:${RESEND_FROM:MedChain <onboarding@resend.dev>}}
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:${SPRING_MAIL_FROM:}}
brevo.from.name=${BREVO_FROM_NAME:MedChain Security}
