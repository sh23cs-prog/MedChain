spring.application.name=medchain-backend
server.port=8080

# ─── MongoDB ────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/medchain}
spring.data.mongodb.database=medchain

# ─── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:medchain_super_secret_key_2025_blockchain_secure_minimum_256_bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── ML Service ─────────────────────────────────────────────────────────────────
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ─── CORS ────────────────────────────────────────────────────────────────────────
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Blockchain ──────────────────────────────────────────────────────────────────
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL:http://localhost:8545}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
# WARNING: Never commit real private keys. This is Hardhat's test account #0 only.
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

# ─── IPFS ────────────────────────────────────────────────────────────────────────
ipfs.api.url=${IPFS_API_URL:http://localhost:5001}
ipfs.gateway.url=${IPFS_GATEWAY_URL:http://localhost:8080}
ipfs.enabled=${IPFS_ENABLED:true}

# ─── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging.level.com.medchain=DEBUG
logging.level.org.springframework.security=WARN

# ─── Swagger ─────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── File Upload ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
