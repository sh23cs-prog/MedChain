version: '3.8'

services:

  # ─── PostgreSQL Database (Production Persistence) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medchain-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medchaindb}
      POSTGRES_USER: ${POSTGRES_USER:-medchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medchain_prod_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medchain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medchain} -d ${POSTGRES_DB:-medchaindb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Hardhat Local EVM Test Network ─────────────────────────────────────────
  # NOTE: Local EVM Test Network for smart contract transaction verification.
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: medchain-blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    networks:
      - medchain-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8545"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── FastAPI Sentinel AI Anomaly Microservice ───────────────────────────────
  sentinel-ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: medchain-sentinel-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - medchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Core Backend Service ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medchain-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medchaindb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medchain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medchain_prod_password}
      JWT_SECRET: ${JWT_SECRET:-medchain_production_super_secret_jwt_key_minimum_256_bits_length}
      JWT_EXPIRATION: 86400000
      AES_SECRET_KEY: ${AES_SECRET_KEY:-MedChainProductionSecretKey2026AES256GCM}
      ML_SERVICE_URL: http://sentinel-ml:8000
      BLOCKCHAIN_ENABLED: "true"
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80
      FILE_STORAGE_LOCATION: /app/uploads
    volumes:
      - medical_file_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      sentinel-ml:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    networks:
      - medchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── React + Nginx Reverse Proxy Frontend ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_MOCK_MODE: "false"
        REACT_APP_API_URL: ""
    container_name: medchain-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medchain-net

volumes:
  postgres_data:
  medical_file_storage:

networks:
  medchain-net:
    driver: bridge
